<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¡Aprende las Tablas de Multiplicar Jugando! 🎈</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@600;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Quicksand', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #a8edd9 0%, #fed6e3 100%);
      min-height: 100vh;
      padding: 1.5rem;
      text-align: center;
    }

    h1 {
      font-family: 'Fredoka One', cursive;
      color: #ff4757;
      font-size: 2.5rem;
      text-shadow: 2px 2px 0px #ffffff;
      margin-bottom: 0.5rem;
    }

    p.subtitle {
      font-size: 1.2rem;
      color: #2ed573;
      font-weight: bold;
      margin-bottom: 1.5rem;
      text-shadow: 1px 1px 0px #fff;
    }

    /* Selector de Tablas */
    .tabs-nav {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 2rem;
    }

    .btn-tab {
      font-family: 'Fredoka One', cursive;
      font-size: 1.2rem;
      padding: 10px 20px;
      border: 3px solid #fff;
      border-radius: 25px;
      cursor: pointer;
      color: white;
      box-shadow: 0 5px 0px rgba(0,0,0,0.1);
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .btn-tab:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 0px rgba(0,0,0,0.1);
    }

    .btn-tab:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0px rgba(0,0,0,0.1);
    }

    /* Colores para cada botón/tabla */
    .t-1 { background-color: #ff6b6b; }
    .t-2 { background-color: #ff9ff3; }
    .t-3 { background-color: #feca57; }
    .t-4 { background-color: #1dd1a1; }
    .t-5 { background-color: #48dbfb; }
    .t-6 { background-color: #5f27cd; }

    /* Contenedor de Tarjetas */
    .table-card {
      background: white;
      max-width: 450px;
      margin: 0 auto;
      border-radius: 20px;
      padding: 1.5rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      border: 5px solid #fff;
    }

    .table-title {
      font-family: 'Fredoka One', cursive;
      font-size: 2rem;
      margin-bottom: 1rem;
    }

    /* Filas de operaciones */
    .operation-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f8f9fa;
      margin: 8px 0;
      padding: 10px 20px;
      border-radius: 15px;
      font-size: 1.4rem;
      font-weight: 700;
    }

    /* Botón Revelar Resultado */
    .btn-reveal {
      font-family: 'Fredoka One', cursive;
      background: #ff9f43;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.2s;
    }

    .btn-reveal:hover {
      background: #ee5253;
      transform: scale(1.05);
    }

    .result-text {
      color: #10ac84;
      font-family: 'Fredoka One', cursive;
      font-size: 1.6rem;
      animation: pop 0.3s ease-out;
    }

    @keyframes pop {
      0% { transform: scale(0); }
      80% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

  <h1>🌟 ¡Tablas Mágicas! 🌟</h1>
  <p class="subtitle">Elige una tabla y toca la estrella para descubrir la respuesta</p>

  <div class="tabs-nav">
    <button class="btn-tab t-1" onclick="renderTable(1, '#ff6b6b')">Tabla del 1 🎈</button>
    <button class="btn-tab t-2" onclick="renderTable(2, '#ff9ff3')">Tabla del 2 🦄</button>
    <button class="btn-tab t-3" onclick="renderTable(3, '#feca57')">Tabla del 3 🐱</button>
    <button class="btn-tab t-4" onclick="renderTable(4, '#1dd1a1')">Tabla del 4 🐸</button>
    <button class="btn-tab t-5" onclick="renderTable(5, '#48dbfb')">Tabla del 5 🚀</button>
    <button class="btn-tab t-6" onclick="renderTable(6, '#5f27cd')">Tabla del 6 👾</button>
  </div>

  <div class="table-card" id="card-container"></div>

  <script>
    function renderTable(tableNum, color) {
      const container = document.getElementById('card-container');
      
      let rowsHTML = '';
      for (let i = 1; i <= 10; i++) {
        const result = tableNum * i;
        rowsHTML += `
          <div class="operation-row">
            <span>${tableNum} × ${i} =</span>
            <button class="btn-reveal" onclick="revealResult(this, ${result})">⭐ Ver</button>
          </div>
        `;
      }

      container.innerHTML = `
        <div class="table-title" style="color: ${color}">Tabla del ${tableNum}</div>
        ${rowsHTML}
      `;
    }

    function revealResult(button, result) {
      const parent = button.parentElement;
      // Reemplaza el botón por la respuesta animada
      parent.innerHTML = `
        <span>${parent.children[0].innerText}</span>
        <span class="result-text">${result} 🎉</span>
      `;
    }

    // Cargar la tabla del 1 al inicio por defecto
    renderTable(1, '#ff6b6b');
  </script>

</body>
</html>
