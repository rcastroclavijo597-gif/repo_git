<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¡Desafío de las Tablas de Multiplicar! 🎮⭐</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@600;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Quicksand', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #a8edd9 0%, #fed6e3 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }

    .game-container {
      background: white;
      width: 100%;
      max-width: 500px;
      border-radius: 25px;
      padding: 2rem;
      box-shadow: 0 15px 30px rgba(0,0,0,0.15);
      border: 6px solid #fff;
      text-align: center;
      position: relative;
    }

    h1 {
      font-family: 'Fredoka One', cursive;
      color: #ff4757;
      font-size: 2.2rem;
      text-shadow: 2px 2px 0px #ffffff;
      margin-bottom: 0.5rem;
    }

    /* Tablero de Marcador */
    .scoreboard {
      display: flex;
      justify-content: space-around;
      background: #f1f2f6;
      border-radius: 15px;
      padding: 10px;
      margin-bottom: 1.5rem;
      font-weight: 700;
      font-size: 1.1rem;
    }

    .score-item {
      color: #2f3542;
    }

    .score-item span {
      font-family: 'Fredoka One', cursive;
      font-size: 1.4rem;
      color: #ff6b6b;
    }

    /* Selector de Tablas */
    .table-selector {
      margin-bottom: 1.5rem;
    }

    .table-selector label {
      font-weight: 700;
      color: #57606f;
      display: block;
      margin-bottom: 0.5rem;
    }

    .table-selector select {
      font-family: 'Fredoka One', cursive;
      font-size: 1.2rem;
      padding: 8px 15px;
      border-radius: 12px;
      border: 3px solid #70a1ff;
      background: #f1f2f6;
      color: #2f3542;
      cursor: pointer;
      outline: none;
    }

    /* Tarjeta de la Pregunta */
    .question-card {
      background: #f8f9fa;
      border-radius: 20px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      border: 3px dashed #70a1ff;
    }

    .question-text {
      font-family: 'Fredoka One', cursive;
      font-size: 3rem;
      color: #2f3542;
    }

    /* Grilla de Opciones */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .btn-option {
      font-family: 'Fredoka One', cursive;
      font-size: 1.8rem;
      background: #70a1ff;
      color: white;
      border: none;
      padding: 15px;
      border-radius: 18px;
      cursor: pointer;
      box-shadow: 0 6px 0px #1e90ff;
      transition: all 0.1s ease;
    }

    .btn-option:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 0px #1e90ff;
    }

    .btn-option:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0px #1e90ff;
    }

    /* Estilos para Respuestas Correctas/Incorrectas */
    .btn-option.correct {
      background: #2ed573 !important;
      box-shadow: 0 6px 0px #26af5f !important;
      animation: bounce 0.4s ease;
    }

    .btn-option.wrong {
      background: #ff4757 !important;
      box-shadow: 0 6px 0px #d63031 !important;
      animation: shake 0.3s ease;
    }

    /* Animaciones */
    @keyframes bounce {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }

    /* Efectos de Celebración */
    .feedback-msg {
      font-family: 'Fredoka One', cursive;
      font-size: 1.3rem;
      height: 30px;
      margin-top: 1rem;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <h1>🎮 ¡Desafío de Tablas! 🚀</h1>

    <!-- Marcador -->
    <div class="scoreboard">
      <div class="score-item">Puntos: <span id="score">0</span> ⭐</div>
      <div class="score-item">Racha: <span id="streak">0</span> 🔥</div>
    </div>

    <!-- Selector de Tabla -->
    <div class="table-selector">
      <label for="table-select">Elige la tabla para practicar:</label>
      <select id="table-select" onchange="resetGame()">
        <option value="all">Todas las tablas (1 al 6) 🎲</option>
        <option value="1">Tabla del 1 🎈</option>
        <option value="2">Tabla del 2 🦄</option>
        <option value="3">Tabla del 3 🐱</option>
        <option value="4">Tabla del 4 🐸</option>
        <option value="5">Tabla del 5 🚀</option>
        <option value="6">Tabla del 6 👾</option>
      </select>
    </div>

    <!-- Área de la Pregunta -->
    <div class="question-card">
      <div class="question-text" id="question">2 × 3 = ?</div>
    </div>

    <!-- Opciones de Respuesta -->
    <div class="options-grid" id="options-container">
      <!-- Los botones se generan dinámicamente con JS -->
    </div>

    <!-- Mensaje de Feedback -->
    <div class="feedback-msg" id="feedback"></div>
  </div>

  <script>
    let score = 0;
    let streak = 0;
    let currentAnswer = 0;
    let isClickable = true;

    function getRandomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function generateQuestion() {
      isClickable = true;
      document.getElementById('feedback').innerText = '';
      
      const selectedTable = document.getElementById('table-select').value;
      
      let num1;
      if (selectedTable === 'all') {
        num1 = getRandomInt(1, 6);
      } else {
        num1 = parseInt(selectedTable);
      }
      
      const num2 = getRandomInt(1, 10);
      currentAnswer = num1 * num2;

      // Mostrar la pregunta
      document.getElementById('question').innerText = `${num1} × ${num2} = ?`;

      // Generar 4 opciones únicas (1 correcta, 3 incorrectas)
      const options = new Set();
      options.add(currentAnswer);

      while (options.size < 4) {
        // Generar respuestas tramposas cercanas a la correcta
        let wrongAnswer = currentAnswer + getRandomInt(-5, 5);
        if (wrongAnswer > 0 && wrongAnswer !== currentAnswer) {
          options.add(wrongAnswer);
        }
      }

      // Convertir el Set a Array y mezclar de forma aleatoria
      const shuffledOptions = Array.from(options).sort(() => Math.random() - 0.5);

      // Renderizar los botones de opciones
      const optionsContainer = document.getElementById('options-container');
      optionsContainer.innerHTML = '';

      shuffledOptions.forEach(option => {
        const btn = document.createElement('button');
        btn.className = 'btn-option';
        btn.innerText = option;
        btn.onclick = () => checkAnswer(option, btn);
        optionsContainer.appendChild(btn);
      });
    }

    function checkAnswer(selectedOption, button) {
      if (!isClickable) return;
      isClickable = false;

      const feedback = document.getElementById('feedback');

      if (selectedOption === currentAnswer) {
        button.classList.add('correct');
        score += 10;
        streak += 1;
        feedback.style.color = '#2ed573';
        feedback.innerText = '¡Excelente! 🎉 (+10 pts)';
      } else {
        button.classList.add('wrong');
        streak = 0;
        feedback.style.color = '#ff4757';
        feedback.innerText = `¡Ups! Era ${currentAnswer} 😅`;
        
        // Resaltar la respuesta correcta para que el niño aprenda
        const buttons = document.querySelectorAll('.btn-option');
        buttons.forEach(btn => {
          if (parseInt(btn.innerText) === currentAnswer) {
            btn.classList.add('correct');
          }
        });
      }

      // Actualizar marcador
      document.getElementById('score').innerText = score;
      document.getElementById('streak').innerText = streak;

      // Cargar siguiente pregunta después de un breve tiempo
      setTimeout(() => {
        generateQuestion();
      }, 1500);
    }

    function resetGame() {
      generateQuestion();
    }

    // Iniciar el juego por primera vez
    generateQuestion();
  </script>

</body>
</html>
